<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Physical AI Research</title>
  <meta name="description" content="物理智能研究工作台：VLA、力/触觉融合、世界模型与机械臂部署的知识章节与论文笔记" />
  <link rel="stylesheet" href="vendor/hljs/styles/github.min.css" id="hljsLight" />
  <link rel="stylesheet" href="vendor/hljs/styles/github-dark.min.css" id="hljsDark" disabled />
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="progress" class="progress-bar"></div>
  <div id="toast" class="toast" hidden></div>
  <button id="toTop" class="to-top" title="回到顶部" hidden data-icon="arrowUp"></button>

  <header class="topbar">
    <button id="toggleNav" class="icon-btn" title="显示/隐藏目录（[）" data-icon="menu"></button>
    <a class="brand" href="#/" title="总览">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 27.3 9.5v13L16 29 4.7 22.5v-13z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.6" fill="currentColor"/><circle cx="16" cy="8" r="1.7" fill="currentColor"/><circle cx="9.2" cy="20" r="1.7" fill="currentColor"/><circle cx="22.8" cy="20" r="1.7" fill="currentColor"/><path d="M16 10v3.4M10.7 19.2l3.1-1.8M21.3 19.2l-3.1-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="brand-text"><b>Physical AI</b><span>Research</span></span>
    </a>
    <nav class="topnav" aria-label="视图">
      <a href="#/" data-nav="home" data-icon="home"><span class="nav-label">总览</span></a>
      <a href="#/papers" data-nav="papers" data-icon="papers"><span class="nav-label">论文库</span></a>
      <a href="#/graph" data-nav="graph" data-icon="graph"><span class="nav-label">关联图</span></a>
      <a href="#/browse" data-nav="browse" data-icon="filter"><span class="nav-label">分类</span></a>
    </nav>
    <button id="searchBtn" class="search-btn" title="搜索（⌘K / Ctrl+K）" data-icon="search">
      <span class="search-label">搜索章节、论文、命令…</span><kbd>⌘K</kbd>
    </button>
    <div class="topbar-actions">
      <a id="newNoteBtn" class="btn ghost" href="#/new" title="新建笔记（n）" data-icon="edit">笔记</a>
      <button id="importBtn" class="btn ghost" title="导入论文生成笔记" data-icon="plus">导入论文</button>
      <button id="themeBtn" class="icon-btn" title="切换深浅色"></button>
      <button id="toggleChat" class="btn primary" title="研究助手（]）" data-icon="chat">研究助手</button>
    </div>
  </header>

  <div id="layout" class="layout">
    <nav id="nav" class="nav" aria-label="目录">
      <div class="nav-tools">
        <input id="navFilter" type="search" placeholder="筛选章节、标签…" autocomplete="off" aria-label="筛选章节" />
        <a id="navBrowse" class="nav-browse" href="#/browse" title="按主题、类型、难度、标签筛选" data-icon="filter"></a>
      </div>
      <nav class="nav-views" aria-label="视图">
        <a href="#/" data-nav="home" data-icon="home">总览</a>
        <a href="#/papers" data-nav="papers" data-icon="papers">论文库</a>
        <a href="#/graph" data-nav="graph" data-icon="graph">关联图</a>
        <a href="#/browse" data-nav="browse" data-icon="filter">分类</a>
      </nav>
      <div id="stats" class="nav-stats"></div>
      <div id="tree" class="tree"></div>
      <div id="navEmpty" class="nav-empty" hidden>没有匹配的章节</div>
      <div class="nav-legend" aria-label="图例">
        <span><i class="dot beginner"></i>入门</span><span><i class="dot intermediate"></i>进阶</span><span><i class="dot advanced"></i>高级</span><span><b class="ok">✓</b>已复核</span>
      </div>
    </nav>
    <div id="navBackdrop" class="nav-backdrop"></div>

    <main id="main" class="main">
      <div class="page">
        <article id="content" class="content"></article>
        <aside id="toc" class="rail"></aside>
      </div>
    </main>
  </div>

  <!-- 研究助手抽屉 -->
  <aside id="chat" class="chat">
    <div class="chat-header">
      <div class="chat-title">
        <strong data-icon="flask">研究助手</strong>
        <div id="chatModel" class="muted small"></div>
      </div>
      <div class="chat-header-actions">
        <button id="clearChat" class="btn ghost small">清空</button>
        <button id="closeChat" class="icon-btn" title="关闭" data-icon="x"></button>
      </div>
    </div>
    <div id="chatLog" class="chat-log">
      <div class="chat-empty" id="chatEmpty">
        <p>基于知识库回答，并附文档链接；可以把结论整理成笔记写回知识库。</p>
        <div class="chips">
          <button class="chip" data-q="用大白话解释当前章节的核心概念，并给出一个类比">解释当前章节</button>
          <button class="chip" data-q="把当前论文的方法和 ForceVLA 的力/触觉融合方式做对比：融合位置、训练目标、实验设置，列成表格">与 ForceVLA 对比</button>
          <button class="chip" data-q="列出当前文档里所有『待解决』的问题，并告诉我知识库里哪些章节或论文可能已经有答案">梳理待解决问题</button>
          <button class="chip" data-q="根据当前论文笔记生成一份可执行的复现清单：环境、数据、超参数、预期指标，缺失项标出来">生成复现清单</button>
          <button class="chip" data-q="根据当前章节给我出 3 道练习题，先不要给答案">出 3 道练习题</button>
          <button class="chip" data-q="总结当前章节的要点，并整理成一份笔记保存到 notes/">整理成笔记</button>
        </div>
      </div>
    </div>
    <form id="chatForm" class="chat-form">
      <textarea id="chatInput" rows="1" placeholder="提问，Enter 发送，Shift+Enter 换行"></textarea>
      <div class="chat-actions">
        <label class="muted small"><input type="checkbox" id="withContext" checked /> 结合当前文档</label>
        <span class="chat-btns"><button type="button" id="chatStop" class="btn small" hidden data-icon="square">停止</button><button type="submit" class="btn primary small">发送</button></span>
      </div>
    </form>
  </aside>

  <!-- 搜索面板 -->
  <div id="palette" class="palette" hidden>
    <div class="palette-box">
      <input id="paletteInput" type="search" placeholder="搜索标题、段落、命令…（支持中英文）" autocomplete="off" />
      <div id="paletteResults" class="palette-results"></div>
      <div class="palette-foot muted small" id="paletteFoot">↑↓ 选择 · Enter 打开 · Esc 关闭</div>
    </div>
  </div>

  <!-- 导入论文 -->
  <dialog id="importDialog">
    <form id="importForm">
      <h2>导入论文 → 生成笔记</h2>
      <p class="muted">支持 arXiv 链接、PDF 链接或本地 PDF。生成的笔记遵循 STANDARD.md 第 5、11 节：自动关联相关知识章节，并更新论文库目录。保存后请人工复核并把 status 改为 reviewed。</p>
      <label>论文链接（arXiv / PDF）<input id="paperUrl" type="url" placeholder="https://arxiv.org/abs/2505.22159" /></label>
      <label>或选择本地 PDF<input id="paperFile" type="file" accept="application/pdf" /></label>
      <div class="row">
        <label>保存到文件夹<input id="paperDir" list="dirList" value="Knowledge/Papers/VLA" /><datalist id="dirList"></datalist></label>
        <label>topic<input id="paperTopic" placeholder="论文库内自动推断" /></label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="importCancel">取消</button>
        <button type="submit" class="btn primary">开始生成</button>
      </div>
      <pre id="importProgress" class="progress-log" hidden></pre>
    </form>
  </dialog>

  <script src="vendor/marked/marked.min.js"></script>
  <script src="vendor/hljs/highlight.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/contrib/auto-render.min.js"></script>
  <script src="vendor/mermaid/mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
